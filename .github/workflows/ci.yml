name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    # Links rot on someone else's schedule, not ours. A weekly run catches a host
    # disappearing before a judge does.
    - cron: "17 6 * * 1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with: { scarb-version: "2.14.0" }
      - uses: foundry-rs/setup-snfoundry@v3
        with: { starknet-foundry-version: "0.53.0" }
      - run: scarb fmt --check
      - run: scarb build
      - run: snforge test
      # Every external entrypoint must be reachable from the interface, or declared as
      # deliberately not. `abandon` shipped tested and documented with no button anywhere.
      - run: scarb -P release build
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node scripts/check-reachability.mjs

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  links:
    # The guard that used to sit here excluded the 6-hourly deploy-drift schedule, which
    # has moved to its own workflow. With that cron gone the condition was always true,
    # which is worse than absent: it reads as a rule and enforces nothing.
    #
    # Every dead URL we have shipped was a well-formed link to a host that had gone
    # away: a retired Blast RPC, then sepolia.starkscan.co. Only a real request finds
    # those, so this makes one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node scripts/check-links.mjs
        env:
          SITE: https://vickrey.0xo.in

