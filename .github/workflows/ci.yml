name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    # Links rot on someone else's schedule, not ours. A weekly run catches a host
    # disappearing before a judge does.
    - cron: "17 6 * * 1"
    # Deploy drift is faster-moving and more expensive, so it gets its own cadence.
    - cron: "23 */6 * * *"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with: { scarb-version: "2.14.0" }
      - uses: foundry-rs/setup-snfoundry@v3
        with: { starknet-foundry-version: "0.53.0" }
      - run: scarb fmt --check
      - run: scarb build
      - run: snforge test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  links:
    # Weekly is enough for links; skip them on the 6-hourly deploy-drift run.
    if: github.event.schedule != '23 */6 * * *'
    # Every dead URL we have shipped was a well-formed link to a host that had gone
    # away: a retired Blast RPC, then sepolia.starkscan.co. Only a real request finds
    # those, so this makes one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node scripts/check-links.mjs
        env:
          SITE: https://vickrey.0xo.in

  deployed:
    # Four commits once sat on main while the live URL served an older build, because
    # the Vercel project has no git repository connected and every deploy is manual.
    #
    # Deliberately NOT on push. With manual deploys, "main is ahead of live" is the
    # normal state for the minutes between pushing and deploying, so a push-triggered
    # check would fail almost every time and be trained away within a day. On a schedule
    # it only fires when the drift has actually persisted, which is the failure that
    # happened. Also dispatchable, for the last day when you want to be certain.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the check names the commits that are not live yet
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node scripts/check-deployed.mjs
        env:
          SITE: https://vickrey.0xo.in
