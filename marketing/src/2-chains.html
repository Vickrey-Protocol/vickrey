<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip 2 — prove without opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<link rel="stylesheet" href="clip.css">
<!--
  An illustration, not data: eight levels with no prices and no level numbers.
  The ascending chain lights from the bottom end up to the bid's level; the descending
  chain from the top end down to it. They meet at one level only — the construction the
  site's Thermometer diagram draws.
-->
<style>
  .content { display: flex; flex-direction: column; justify-content: center; gap: 160px; }
  .diagram { position: relative; width: 1500px; margin-inline: auto; }
  .row { position: relative; height: 64px; display: flex; justify-content: space-between; align-items: center; }
  .row + .gap { height: 150px; }
  .rail { position: absolute; left: 32px; right: 32px; top: 50%; height: 3px; translate: 0 -50%; background: var(--line); }
  .lit { position: absolute; top: 50%; height: 5px; translate: 0 -50%; background: var(--seal); border-radius: 3px;
    transform-origin: var(--from); animation: grow-x var(--dur) linear var(--at) both; }
  @keyframes grow-x { from { transform: scaleX(0); } to { transform: none; } }
  .node { position: relative; width: 64px; height: 64px; display: grid; place-items: center; z-index: 1; }
  .node::before { content: ""; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 3px solid var(--line-2); }
  .node i { position: absolute; width: 42px; height: 42px; border-radius: 50%; background: var(--seal);
    animation: pop .3s var(--ease) var(--at) both; }
  .meet { position: absolute; top: -26px; bottom: -26px; width: 96px; border: 4px solid var(--ember); border-radius: 22px;
    left: calc(32px + (1500px - 64px) * 4 / 7 - 48px); animation: pop .4s var(--ease) 2.25s both; }
  .label { position: absolute; font-size: 44px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
  .label.up   { left: 0;  top: -86px; }
  .label.down { right: 0; bottom: -86px; }
  .label small { display: block; font-family: "Geist Mono", monospace; font-size: 18px; font-weight: 400;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .neither { text-align: center; font-size: 56px; font-weight: 600; letter-spacing: -.025em; }
  .neither em { font-style: normal; color: var(--seal); }
  @media (max-aspect-ratio: 5/4) {
    .content { justify-content: flex-start; padding-top: 150px; gap: 150px; }
    .diagram { width: 936px; }
    .meet { left: calc(32px + (936px - 64px) * 4 / 7 - 48px); }
    .row + .gap { height: 130px; }
    .label { font-size: 38px; }
    .neither { font-size: 48px; }
  }
</style>
</head>
<body>
<img class="mark" src="mark.png" alt="">
<div class="content">
  <h1 class="head in" style="--at:.3s">Prove the winner without opening a bid</h1>

  <div class="diagram">
    <div class="label up in" style="--at:1.0s"><small>ascending chain</small>at least</div>
    <!-- ascending: lights left → the bid's level (node 4 of 0–7), one link every 0.25 s -->
    <div class="row">
      <div class="rail"></div>
      <div class="lit" style="left:32px; width:calc((100% - 64px) * 4 / 7); --from:left; --at:1.1s; --dur:1s"></div>
      <div class="node"><i style="--at:1.1s"></i></div><div class="node"><i style="--at:1.35s"></i></div>
      <div class="node"><i style="--at:1.6s"></i></div><div class="node"><i style="--at:1.85s"></i></div>
      <div class="node"><i style="--at:2.1s"></i></div><div class="node"></div>
      <div class="node"></div><div class="node"></div>
    </div>
    <div class="gap"></div>
    <!-- descending: lights right → the same level, one link every 0.333 s, arriving together -->
    <div class="row">
      <div class="rail"></div>
      <div class="lit" style="right:32px; width:calc((100% - 64px) * 3 / 7); --from:right; --at:1.1s; --dur:1s"></div>
      <div class="node"></div><div class="node"></div><div class="node"></div><div class="node"></div>
      <div class="node"><i style="--at:2.1s"></i></div><div class="node"><i style="--at:1.77s"></i></div>
      <div class="node"><i style="--at:1.43s"></i></div><div class="node"><i style="--at:1.1s"></i></div>
    </div>
    <div class="meet"></div>
    <div class="label down in" style="--at:1.0s"><small>descending chain</small>at most</div>
  </div>

  <p class="neither in" style="--at:2.9s">Neither says <em>the number.</em></p>
</div>
<div class="end"><div class="lockup"><img src="mark.png" alt=""><span>Vickrey</span></div></div>
<script src="clip.js"></script>
</body>
</html>
